# 우서현 요청: AppBTI_123_요약의 분석·설문 비교 설계를 기록한 실제 데이터 코드북 초안.
# 대상은 이미 정제된 clean.csv의 표준 컬럼이다. 제공처 원본은 먼저 별도 정제가 필요하다.
# 접속 횟수 해석은 사용자 가정이며 제공처 확정 정의와 구분한다. 실제 측정값은 넣지 않는다.
# TODO(확인 필요): 현우에게 분류·정제 계약, 진용에게 횟수 응답·코사인 계약을 인계한다.
# 현재 Python의 일수 상한·안전민감 제외 처리와 Java의 응답/API 계약은 별도 구현이 필요하다.
