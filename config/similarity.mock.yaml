# 목업(가상 A~F 6집단) 설문 비교 설정. 실제 데이터와 같은 v2 방식(CLR + 최근접 중심)으로 맞춰
# 프론트가 v2 형식 하나만 처리하게 한다. 값은 config/similarity.yaml과 같다.
enabled: true
method: clr_nearest
minimum_items: 6
clr_scope: answered_items
clr_blocks: joint
time_choice_minutes: [1.7, 5.5, 17.3, 42.4, 84.9]
days_scale: 7
near_tie_ratio: 0.05
similar_difference: 0.1
flat_pattern_ratio: null
close_value_ratio: 1.25
time_choice_edges: [3, 10, 30, 60]
# TODO(확인 필요): 결과 유형 이름(resultType). 정해지기 전에는 비워 둔다.
types: []
