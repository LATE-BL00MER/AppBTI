# 제외 정책의 계약이다. 현행 공통 어댑터는 이 키를 적용하지 않으므로 구현 전 실제 실행 금지.
exclude_minor_names:
  - 안전민감

statuses:
  normal: normal
  missing: missing
  suppressed: suppressed
  정상: normal
  결측: missing
  비공개: suppressed

# 기존 공통 파이프라인 호환 키. 미확정 UU 가중 기준값·시간 변환은 계속 끈다.
metrics:
  avg_days_denominator: null  # TODO(확인 필요): 평균의 대상 인원·분모
  weighted_reference_days_enabled: false
  daily_time:
    enabled: false  # avg_daily_time을 시간으로 환산하거나 시간 비교에 사용하지 않는다.
    source_unit: null
    definition: null
    denominator: null
    target_unit: minutes  # 기존 시간 경로의 호환 필드이며 위 enabled=false로 미사용

# TODO(확인 필요): 분류·집계 기준 변경 월. 확인되지 않은 경계를 지어내지 않는다.
continuity_breaks: []

# 아래는 실제 분석·횟수 설문의 새 계약이다. 기존 실행기는 아직 이 블록을 읽지 않는다.
# 목업은 일수·시간 시연이므로 이 블록을 적용하면 안 된다.
real_analysis:
  apply_only_when_is_mock_false: true
  status: draft
  runtime_ready: false
  input:
    format: clean_canonical
    filename: clean.csv
    month_format: YYYY-MM
    duplicate_key: [month, age_group, minor_code]
    missing_policy: null
    uu_zero_policy: exclude_as_unavailable
    exclude_names_from: exclude_minor_names
  metric_definitions:
    avg_days:
      meaning: monthly_access_count
      unit: count
      definition_status: user_assumption
      minimum: 0
      maximum: null  # 횟수이므로 달의 일수로 상한을 제한하지 않는다.
      role: primary
    avg_daily_time:
      meaning: daily_access_count
      unit: count
      definition_status: user_assumption
      minimum: 0
      maximum: null
      role: supplementary_only
    time_unit:
      role: ignored

  # 1. Maximum Absolute Scaling: 비음수에서는 x/max(x)와 같다.
  # 비교표는 각 월·중분류 안의 6연령에 따로 적용한다. PDF의 대표 표만 6월이다.
  exploration:
    method: max_abs
    metric: avg_days
    group_by: [month, minor_code]
    fit_axis: age_group
    require_all_age_groups: true
    zero_max_policy: null
    clip: false
    display_month: "2025-06"

  # 2. Fisher Score: 연령 중심 간 차이 B / 같은 연령의 월별 변동 W.
  # 6개월 원값을 쓰며, 위 최대값=1 표를 입력하거나 전월 대비 변동률을 계산하지 않는다.
  # 개인 변별력·유의성이나 '가짜 데이터 제거'를 보장하지 않는 집단 수준 검토다.
  candidate_review:
    stage: offline_python
    metric: avg_days
    start_month: "2025-01"
    end_month: "2025-06"
    input_scale: raw
    respect_continuity_breaks: true
    fisher:
      method: between_within_scatter_ratio
      within_scatter: temporal_variation_within_age_group
      require_complete_month_age_grid: true
      zero_within_policy: explicit_status
      p_values_enabled: false
    leave_one_month_out:
      enabled: true
      recompute: [centers, between_scatter, within_scatter, fisher_rank, fcq_selection]
      minimum_remaining_months: 2
    # 3. FCQ: F-test Correlation Quotient 계열의 순차 근사 검토.
    # 균형 자료에서 F 통계량과 일정 배수인 Fisher를 관련성으로 사용한다.
    # epsilon은 0 나누기 보호값이다. FCQ만으로 최종 12문항을 자동 확정하지 않는다.
    fcq:
      method: greedy_fisher_correlation_quotient
      relevance: fisher_score
      redundancy: mean_absolute_pearson
      correlation_floor: 0.000001
      floor_sensitivity: [0.001, 0.01]
      review_size: 12
      role: redundancy_review_only
      automatic_finalization: false
    final_selection: statistics_and_question_review
survey_selection:
  primary_codes:
  - general_mall
  - food_delivery
  - weather
  - online_news
  - sns
  - messenger
  - webtoon
  - game
  - music
  - ott
  - radio
  - sports
  conditional_primary_codes:
  - game
  reserve_codes:
  - curriculum
  - health_info

# 서비스 구현 시 similarity.yaml과 함께 읽을 추가 계약. 현재는 문서화된 초안이다.
survey_contract:
  response_unit: count
  response_period: previous_calendar_month
  response_type: nonnegative_integer
  response_maximum: null
  unknown_policy: null
  skipped_policy: null
  zero_count_policy: exclude_pending_denominator
  reference_metric: avg_days
  reference_month: "2025-06"
  normalization: reference_max
  refit_with_user_answer: false
  clip: false
  require_all_age_groups: true
  constant_category_policy: exclude
  zero_norm_policy: insufficient
  tie_tolerance: 0.000000001
  daily_metric_enabled: false
  weekly_comparison_enabled: false
  evidence:
    method: normalized_absolute_difference
    closest_count: 3
    farthest_count: 3
    tie_breaker: minor_code
  score:
    formula: "100 * weighted_cosine_similarity"
    interpretation: pattern_similarity_not_probability
  # TODO(확인 필요): 접속 1회·재접속·기기 범위, 평균 분모, 문항 인지 면담·A/B 기간 검증
  required_before_activation:
    - confirm_count_definition_and_denominator
    - implement_count_validation_without_calendar_day_cap
    - implement_excluded_category_filter_and_null_policy
    - implement_fixed_reference_max_and_weighted_cosine
    - align_question_and_profile_api_units
    - validate_monthly_questions_and_zero_count_policy

# 방법 정의·적용 근거. 특정 12문항이나 개인 정확도를 보장하는 출처는 아니다.
method_sources:
  max_abs: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.MaxAbsScaler.html
