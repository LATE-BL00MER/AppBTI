# 후자 버전(시간 = 쓴 날 사용량) 매칭 설정. 기본 similarity.yaml과 시간 선택지 대표 분만 다르다.
# 답한 문항만으로 사용자·연령대 양쪽을 CLR(로그 후 평균 빼기)하고 유클리드 거리로 가장 가까운 연령대를 찾는다.
# '개인 나이를 맞힌다'는 뜻이 아니라 집단 통계와의 응답 패턴 비교다.
enabled: true
method: clr_nearest
minimum_items: 6
clr_scope: answered_items
clr_blocks: joint
# 5지선다 구간 대표 분(구간의 기하 중간값). 쓴 날 사용량 기준이라 경계를 15·30·45·90분으로 올렸다(바깥 구간 5분·180분).
time_choice_minutes: [8.7, 21.2, 36.7, 63.6, 127.3]
days_scale: 7
near_tie_ratio: 0.05
# TODO(확인 필요): 근거 항목의 similar 판정 기준값과 패턴 불명확 기준
similar_difference: 0.1
flat_pattern_ratio: null
# 결과 '가까운 항목'은 상대 비중(CLR)도 가깝고 화면의 일수·시간도 이 배수 안인 항목만. TODO(확인 필요): 우서현 확정
close_value_ratio: 1.25
# 시간 선택지 구간 경계(분). 결과 화면에서 집단 시간을 선택지 문구로 보여 줄 때 쓴다. 선택지 문구와 같은 경계여야 한다.
time_choice_edges: [15, 30, 45, 90]
# TODO(확인 필요): 결과 유형 이름(resultType). 정해지기 전에는 비워 둔다.
types: []
