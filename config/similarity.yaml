# 공통 비교 항목 최소 수의 검토값. 결측·무응답·0회 제외 후 이보다 적으면 insufficient.
minimum_categories: 6

# 동점은 공동 순위. 정밀도·항목 근거 정렬은 codebook.yaml의 survey_contract를 참조한다.
tie_policy: joint

# 기존 Java가 읽는 이름을 유지했다. 새 설계에서의 의미는 '0회 응답 제외'다.
# 0회와 null을 구분하여 보존하고 평균 분모 확인 전에는 0회만 비교에서 제외한다.
zero_days_policy: exclude

# TODO(확인 필요): 유형 이름 미확정. 실제 나이·성격 유형을 생성하지 않는다.
types: []

# Fisher·FCQ는 요청마다 실행하는 채점기가 아니라 Python의 사전 후보 검토 단계다.
# 6개월 원값·월 제외·FCQ 조건은 codebook.yaml의 real_analysis.candidate_review에 있다.
# 위 8개 최상위 키는 현행 SimilaritySettings record와 맞춘다.
# response_unit·reference_month 등 추가 계약을 여기에 임의로 더하면 strict 로더가 실패한다.
