is_mock: false
source: "LG U+ 제공 연령대·기간 집계 / 접속 횟수 해석은 사용자 가정"

# 기존 목업의 한글 컬럼 매핑도 유지한다. 실제 입력에는 영문 표준 컬럼을 쓴다.
columns:
  기준월: month
  연령대(6구간): age_group
  대분류명: major
  중분류 코드: minor_code
  중분류명: minor_name
  월간 유니크 이용자수: uu
  월간 평균 이용일수: avg_days
  일평균 이용시간: avg_daily_time
  시간 단위: time_unit
  데이터 상태: status
  비고: note
  month: month
  age_group: age_group
  age_label: age_label
  major: major
  minor_code: minor_code
  minor_name: minor_name
  uu: uu
  avg_days: avg_days
  avg_daily_time: avg_daily_time
  time_unit: time_unit
  status: status
  note: note
period:
