# 우서현 요청: AppBTI_123_요약에 따른 월간 접속 횟수·패턴 비교 초안.
# 현재 Java는 weighted_absolute_distance + min_max + 일수만 지원한다.
# TODO(확인 필요): 횟수 응답·고정 기준 최대값·가중 코사인 구현 및 사전 검증 후 활성화.
enabled: false

# 4. Cosine Similarity: 전체 이용량의 양수 배율보다 항목별 패턴 방향을 비교한다.
# '개인 나이를 정확히 찾아낸다'는 뜻이 아니며 집단 통계와의 패턴 유사도다.
method: cosine

# 1. 비음수에서 MaxAbs와 같은 x/reference_max. 기준월은 codebook.yaml의 survey_contract.
# 기준월 6연령 최댓값을 항목별로 고정하고 사용자 응답에도 같은 분모를 쓴다.
# 사용자 응답으로 재적합하거나 1로 잘라내지 않는다. Min-Max와 혼동하지 않는다.
normalization: reference_max

# PRIMARY 12개만 1.0. 보완·미선정·제외 항목은 모두 0.0으로 명시한다.
# 현행 계산기의 미기재 코드 기본 가중치가 1이므로 전체 코드의 기본값을 0으로 적는다.
# 게임은 조건부 우선이며, 교체 시 코드북의 survey_selection과 함께 수정한다.
