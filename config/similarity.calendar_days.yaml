# 후자 버전(시간 = 쓴 날 사용량) 매칭 설정. 기본 similarity.yaml과 시간 선택지 대표 분만 다르다.
# 답한 문항만으로 사용자·연령대 양쪽을 CLR(로그 후 평균 빼기)하고 유클리드 거리로 가장 가까운 연령대를 찾는다.
# '개인 나이를 맞힌다'는 뜻이 아니라 집단 통계와의 응답 패턴 비교다.
enabled: true
method: clr_nearest
minimum_items: 6
clr_scope: answered_items
clr_blocks: joint
# 5지선다 구간 대표 분(구간의 기하 중간값). 쓴 날 사용량 기준이라 경계를 10·30·60·120분으로 올렸다.
time_choice_minutes: [5.5, 17.3, 42.4, 84.9, 169.7]
days_scale: 7
near_tie_ratio: 0.05
# TODO(확인 필요): 근거 항목의 similar 판정 기준값과 패턴 불명확 기준
similar_difference: 0.1
flat_pattern_ratio: null
tie_policy: joint
types: []
