spring:
  application:
    name: appbti-backend
server:
  port: 8080
appbti:
  insights-path: ${APPBTI_INSIGHTS_PATH:../data/processed/real/insights.json}
  mock-insights-path: ${APPBTI_MOCK_INSIGHTS_PATH:../data/processed/mock/insights.json}
  mock-time-insights-path: ${APPBTI_MOCK_TIME_INSIGHTS_PATH:../data/processed/mock-time/insights.json}
  findings-path: ${APPBTI_FINDINGS_PATH:../data/processed/real/findings.json}
  mock-findings-path: ${APPBTI_MOCK_FINDINGS_PATH:../data/processed/mock/findings.json}
  mock-time-findings-path: ${APPBTI_MOCK_TIME_FINDINGS_PATH:../data/processed/mock-time/findings.json}
  # 경로는 backend 작업 디렉터리를 기준으로 한다. 실제 산출물 우선, 없으면 가상 산출물.
  profiles-path: ${APPBTI_PROFILES_PATH:../data/processed/real/profiles.json}
  mock-profiles-path: ${APPBTI_MOCK_PROFILES_PATH:../data/processed/mock/profiles.json}
  mock-time-profiles-path: ${APPBTI_MOCK_TIME_PROFILES_PATH:../data/processed/mock-time/profiles.json}
  similarity-path: ${APPBTI_SIMILARITY_PATH:../config/similarity.yaml}
  mock-similarity-path: ${APPBTI_MOCK_SIMILARITY_PATH:../config/similarity.mock.yaml}
  # 실제 설문 문항 설정. 없으면 /meta.survey의 문항 수·기간은 null이다.
  survey-questions-path: ${APPBTI_SURVEY_QUESTIONS_PATH:../config/survey_questions.yaml}
  # 목업 데이터 설문 문항(v2, 가상 중분류). 없으면 목업 설문을 제공하지 않는다.
  mock-survey-questions-path: ${APPBTI_MOCK_SURVEY_QUESTIONS_PATH:../config/survey_questions.mock.yaml}
  # 또래 비교 기준값·문장 템플릿. 없으면 peerComparison을 만들지 않는다.
  peer-messages-path: ${APPBTI_PEER_MESSAGES_PATH:../config/peer_messages.yaml}
