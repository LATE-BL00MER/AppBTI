# API v2 설문 문항 (docs/API.md 4-1). 일수 4 + 시간 10.
# minor_code는 codebook.yaml 중분류 코드와 같아야 한다. 문항 문구는 우서현·신진용 확정 전 초안이다.
# TODO(확인 필요): 일평균 이용시간의 '하루' 기준(이용한 날 / 달력 일수)에 따라 시간 문항 문구를 맞춘다.
period: last7days
time_choices:
  - "잠깐 확인만 해요 (3분 이내)"
  - "10분이 안 돼요 (3~10분)"
  - "10~30분"
  - "30분~1시간"
  - "1시간 이상"
questions:
  - {id: q01, minor_code: weather, metric: days, enabled: true, text: "최근 7일 중 날씨 앱이나 사이트를 며칠 확인했나요?"}
  - {id: q02, minor_code: portal, metric: days, enabled: true, text: "최근 7일 중 포털(네이버, 다음 등)을 며칠 사용했나요?"}
  - {id: q03, minor_code: webtoon, metric: days, enabled: true, text: "최근 7일 중 웹툰을 며칠 봤나요?"}
  - {id: q04, minor_code: game, metric: days, enabled: true, text: "최근 7일 중 모바일·온라인 게임을 며칠 했나요?"}
  - {id: q05, minor_code: portal, metric: time, enabled: true, text: "포털을 사용한 날, 하루에 보통 얼마나 사용하나요?"}
  - {id: q06, minor_code: sns, metric: time, enabled: true, text: "SNS(인스타그램, 페이스북 등)를 사용한 날, 하루에 보통 얼마나 사용하나요?"}
  - {id: q07, minor_code: ott, metric: time, enabled: true, text: "동영상 스트리밍(넷플릭스, 티빙 등)을 이용한 날, 하루에 보통 얼마나 보나요?"}
  - {id: q08, minor_code: music, metric: time, enabled: true, text: "음악 스트리밍(멜론, 지니 등)을 이용한 날, 하루에 보통 얼마나 듣나요?"}
  - {id: q09, minor_code: webtoon, metric: time, enabled: true, text: "웹툰을 본 날, 하루에 보통 얼마나 보나요?"}
  - {id: q10, minor_code: game, metric: time, enabled: true, text: "게임을 한 날, 하루에 보통 얼마나 하나요?"}
  - {id: q11, minor_code: specialty_mall, metric: time, enabled: true, text: "전문 쇼핑몰 앱(무신사, 올리브영 등)을 사용한 날, 하루에 보통 얼마나 사용하나요?"}
  - {id: q12, minor_code: mobile_bank, metric: time, enabled: true, text: "은행 앱을 사용한 날, 하루에 보통 얼마나 사용하나요?"}
  - {id: q13, minor_code: online_stock, metric: time, enabled: true, text: "주식·증권 앱을 사용한 날, 하루에 보통 얼마나 사용하나요?"}
  - {id: q14, minor_code: land_transport, metric: time, enabled: true, text: "기차·고속버스 예매·조회 앱을 사용한 날, 하루에 보통 얼마나 사용하나요?"}
