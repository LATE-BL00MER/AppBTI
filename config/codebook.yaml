# 실제 데이터 코드북. LG U+ 원본 CSV를 받은 그대로 읽는다(정제 CSV·목업 형식도 같은 매핑으로 읽음).
# 원본 정제(열 매핑, YYYYMM 변환, 연령대 ID, 중분류 코드, 안전민감 제외, 상태 판정)는 어댑터가 이 파일로 한다.
# 지표 정의는 LG U+ 답변 기준(이용자 1명당 월 평균 이용일수, 일평균 이용시간(분))이다. 실제 측정값은 넣지 않는다.
# 아래 real_analysis.metric_definitions의 '접속 횟수' 해석은 이전 초안 가정이며 API v2에서는 쓰지 않는다.
schema_version: 1
is_mock: false
source: "LG U+ 제공 연령대·기간(2025년 1~6월) 집계"

# LG U+ 원본 열(받은 그대로), 정제 CSV의 표준 열, 기존 목업의 한글 열을 모두 같은 내부 필드로 읽는다.
columns:
  P_YYYYMM: month
  YY10_AGLV_ID: age_group
  CNC_INFO_CATG_LVL1_NM: major
  CNC_INFO_CATG_LVL2_NM: minor_name
  UNQ_USER_CNT: uu
  AVG_TADV_DAYS: avg_days
  AVG_ASMP_VSIT_TM: avg_daily_time
  기준월: month
  연령대(6구간): age_group
  대분류명: major
  중분류 코드: minor_code
  중분류명: minor_name
  월간 유니크 이용자수: uu
  월간 평균 이용일수: avg_days
  일평균 이용시간: avg_daily_time
  시간 단위: time_unit
  데이터 상태: status
  비고: note
  month: month
  age_group: age_group
  age_label: age_label
  major: major
  minor_code: minor_code
